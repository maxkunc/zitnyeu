<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — zitny.eu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <div id="loginView" class="admin-login" hidden>
      <form id="loginForm" class="admin-login-card">
        <div class="brand" style="margin-bottom:24px">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span class="brand-text">
            <span class="brand-name">Mission control</span>
            <span class="brand-sub">Přihlášení administrátora</span>
          </span>
        </div>
        <label><span>E-mail</span><input type="email" name="email" required autocomplete="username" /></label>
        <label><span>Heslo</span><input type="password" name="password" required autocomplete="current-password" /></label>
        <button type="submit" class="btn btn-primary" id="loginSubmit">Přihlásit se</button>
        <p class="form-status" id="loginStatus" role="status"></p>
      </form>
    </div>

    <div id="appView" class="admin-app" hidden>
      <aside class="admin-side">
        <a href="/" class="brand">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span class="brand-text">
            <span class="brand-name">zitny.eu</span>
            <span class="brand-sub">Mission control</span>
          </span>
        </a>
        <div class="admin-user">
          <div class="admin-user-label">Přihlášen</div>
          <div class="admin-user-name" id="userEmail"></div>
        </div>
        <nav class="admin-nav" id="adminNav">
          <button data-tab="projects" class="active">Projekty</button>
          <button data-tab="workshops">Workshopy</button>
          <button data-tab="achievements">Úspěchy</button>
          <button data-tab="sponsors">Partneři</button>
          <button data-tab="about">O nás</button>
          <button data-tab="messages">Zprávy</button>
          <button data-tab="logs">Historie</button>
        </nav>
        <div class="admin-side-footer">
          <a href="/" class="btn btn-ghost" style="width:100%">Otevřít web</a>
          <button class="btn btn-ghost" id="logoutBtn" style="width:100%;margin-top:8px">Odhlásit se</button>
        </div>
      </aside>
      <main class="admin-main">
        <div id="tab-projects" class="tab"></div>
        <div id="tab-workshops" class="tab" hidden></div>
        <div id="tab-achievements" class="tab" hidden></div>
        <div id="tab-sponsors" class="tab" hidden></div>
        <div id="tab-about" class="tab" hidden></div>
        <div id="tab-messages" class="tab" hidden></div>
        <div id="tab-logs" class="tab" hidden></div>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/admin.js" defer></script>
  </body>
</html>
