name: Keep Supabase project awake

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# This pings the project's REST API on a schedule well inside that window so
# it never goes idle. The request is unauthenticated (public anon key only,
# same key already shipped in the client bundle) and touches no table data.

on:
  schedule:
    - cron: "17 6 */3 * *" # every ~3 days
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://ecacuvajvbfgmsrqpnye.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjYWN1dmFqdmJmZ21zcnFwbnllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjkwNDAsImV4cCI6MjEwMzA0NTA0MH0.4nK-opd4zLPph1MtYSvUORGUqIyy1D3c5zXr9c0Eb7U
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Supabase REST API responded with HTTP $status"
          # Any response (even 401/404) means the gateway is reachable and
          # the project is counted as active — only a connection failure
          # should fail this job.
          if [ -z "$status" ] || [ "$status" = "000" ]; then
            echo "No response from Supabase — project may be unreachable."
            exit 1
          fi
